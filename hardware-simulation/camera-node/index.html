<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TowerIQ Camera Node</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d1117; color: #e6edf5; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: #a7b3c4; font-size: 13px; margin: 0 0 14px; }
  .stage { position: relative; border-radius: 10px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; }
  video, canvas.overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  select, button { background: #161d27; color: #e6edf5; border: 1px solid #324055; padding: 9px 12px; border-radius: 8px; font: inherit; }
  button.primary { background: #3ddc97; color: #062317; border-color: #3ddc97; font-weight: 650; }
  label { font-size: 12px; color: #a7b3c4; display: block; margin-bottom: 4px; }
  .status { padding: 12px; background: #161d27; border: 1px solid #263142; border-radius: 10px; }
  .status.alert { border-color: #f85149; color: #f85149; }
  .log { margin-top: 10px; font: 11px/1.5 ui-monospace, Menlo, monospace; color: #74839a; max-height: 140px; overflow-y: auto; }
  .warn { background: #2a1f0b; border: 1px solid #6b4f12; color: #e3b341; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; }
  input[type=range] { width: 100%; accent-color: #3ddc97; }
</style>
</head>
<body>
<div class="wrap">
  <h1>TowerIQ Camera Node</h1>
  <p class="sub">Motion is detected on this device. Only the event is sent to the platform, never video.</p>
  <div id="pair-warn" class="warn" hidden>This device is not paired. Ask an admin for a pairing link (Settings → Pair a phone camera node).</div>
  <div class="controls">
    <div style="flex:1;min-width:180px"><label for="site">Site this camera watches</label><select id="site" style="width:100%"></select></div>
    <div style="align-self:end"><button id="start" class="primary">Start camera</button></div>
  </div>
  <div class="stage"><video id="video" autoplay playsinline muted></video><canvas id="overlay" class="overlay"></canvas></div>
  <canvas id="proc" width="160" height="120" hidden></canvas>
  <div style="margin-top:12px"><label for="sens">Sensitivity (share of frame that must change)</label><input type="range" id="sens" min="1" max="15" value="4"></div>
  <div class="status" id="status" role="status" aria-live="polite">Camera not started.</div>
  <div class="log" id="log"></div>
</div>
<script src="/camera-node/camera.js"></script>
</body>
</html>
